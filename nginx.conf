server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Inherits /etc/nginx/mime.types from the base image (includes application/wasm).
    # Do not add a bare `types {}` block here - it replaces the whole map.

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Never cache the files that gate every update
    location = /index.html                { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js      { add_header Cache-Control "no-cache"; }
    location = /version.json              { add_header Cache-Control "no-cache"; }
    location = /manifest.json             { add_header Cache-Control "no-cache"; }

    location ~* \.(js|wasm|otf|ttf|woff2?|png|jpg|svg|frag|json|bin|symbols)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
